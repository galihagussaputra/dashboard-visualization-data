services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      ENVIRONMENT: ${ENVIRONMENT}
      IDX_BASE_URL: ${IDX_BASE_URL}
      IDX_REQUEST_DELAY_SECONDS: ${IDX_REQUEST_DELAY_SECONDS}
      IDX_USER_AGENT: ${IDX_USER_AGENT}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./backend:/app
      - raw_docs:/app/raw_docs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:5173/
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
    profiles:
      - ingestion
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      ENVIRONMENT: ${ENVIRONMENT}
      IDX_BASE_URL: ${IDX_BASE_URL}
      IDX_REQUEST_DELAY_SECONDS: ${IDX_REQUEST_DELAY_SECONDS}
      IDX_USER_AGENT: ${IDX_USER_AGENT}
    volumes:
      - ./backend:/app
      - raw_docs:/app/raw_docs
    command:
      - python
      - -m
      - app.ingestion.runner
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  raw_docs:
  frontend_node_modules:
